<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    max-width: 560px;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 20px;
    animation: spin 4s linear infinite;
    display: inline-block;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 32px;
    margin-bottom: 15px;
    color: #38bdf8;
  }
  p {
    font-size: 17px;
    line-height: 1.6;
    color: #cbd5e1;
    margin-bottom: 10px;
  }
  .highlight {
    color: #38bdf8;
    font-weight: 600;
  }
  .bar {
    width: 100%;
    height: 8px;
    background: #334155;
    border-radius: 10px;
    margin: 30px 0;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 60%;
    background: linear-gradient(90deg, #38bdf8, #0ea5e9);
    border-radius: 10px;
    animation: load 2s ease-in-out infinite alternate;
  }
  @keyframes load {
    from { width: 40%; }
    to { width: 75%; }
  }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">⚙️</div>
    <h1>We're Under Maintenance</h1>
    <p>Our WebApp is currently down for <span class="highlight">scheduled maintenance</span>.</p>
    <p>We're working hard to improve our service. We'll be back shortly!</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <p>For urgent inquiries, contact us: <span class="highlight">bmsurescore@gmail.com</span></p>
    <footer>&copy; 2026 Bm SureScore. All rights reserved.</footer>
  </div>
</body>
</html>
