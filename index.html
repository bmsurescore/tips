<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You AGNESS</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
}
#heart{
  width:min(92vw,620px);
  height:auto;
  overflow:visible;
}
.word{
  fill:#f39bc8;
  font-size:13px;
  font-weight:700;
  letter-spacing:.2px;
  opacity:.9;
  filter:url(#glow);
}
.word.bright{opacity:1}
#heartShape{
  fill:none;
  stroke:#f39bc8;
  stroke-width:2;
  opacity:.08;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  12%{transform:scale(1.055)}
  25%{transform:scale(1)}
  42%{transform:scale(1.035)}
  55%{transform:scale(1)}
}
#heartGroup{
  transform-origin:300px 270px;
  animation:pulse 1.5s ease-in-out infinite;
}
</style>
</head>
<body>
  <p>I LOVE YOU AGNESS💋</p>

<svg id="heart" viewBox="0 0 600 540">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Heart outline used as the mathematical path for the words -->
    <path id="heartPath"
      d="M300 485
         C270 455 105 345 105 205
         C105 115 170 65 235 65
         C270 65 292 83 300 110
         C308 83 330 65 365 65
         C430 65 495 115 495 205
         C495 345 330 455 300 485 Z"/>
  </defs>

  <g id="heartGroup">
    <use href="#heartPath" id="heartShape"/>
    <g id="words"></g>
  </g>
</svg>

<script>
/*
  JAVASCRIPT LOGIC
  1. Find the heart path.
  2. Read many positions along that path.
  3. Create "I love you" text at each position.
  4. Rotate each word to follow the heart curve.
  5. Animate the words continuously.
*/

const path = document.getElementById("heartPath");
const words = document.getElementById("words");

const totalItems = 105;
const gap = path.getTotalLength() / totalItems;

let items = [];

for (let i = 0; i < totalItems; i++) {
  const text = document.createElementNS(
    "http://www.w3.org/2000/svg", "text"
  );

  text.textContent = "I love you";
  text.setAttribute("class", "word");

  // Each word gets a different position on the heart.
  const distance = i * gap;

  text.dataset.distance = distance;
  words.appendChild(text);
  items.push(text);
}

// Put every word on the heart and rotate it along the curve.
function drawWords(offset = 0) {
  const length = path.getTotalLength();

  items.forEach((text, i) => {
    let d = (Number(text.dataset.distance) + offset) % length;

    const p = path.getPointAtLength(d);
    const p2 = path.getPointAtLength((d + 1) % length);

    // Direction of the curve
    const angle =
      Math.atan2(p2.y - p.y, p2.x - p.x) * 180 / Math.PI;

    text.setAttribute(
      "transform",
      `translate(${p.x} ${p.y}) rotate(${angle})`
    );

    // A few words glow brighter, similar to the screenshot.
    if ((i + Math.floor(offset / 3)) % 9 === 0) {
      text.classList.add("bright");
    } else {
      text.classList.remove("bright");
    }
  });
}

let offset = 0;

function animate() {
  offset += 0.45;
  drawWords(offset);
  requestAnimationFrame(animate);
}

drawWords();
animate();
</script>

</body>
</html>
